version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "release:patch"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    groups:
      go-patch:
        update-types: ["patch"]
      go-minor:
        update-types: ["minor"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "skip-release"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
    groups:
      npm-all:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "skip-release"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
    groups:
      actions-all:
        patterns: ["*"]
